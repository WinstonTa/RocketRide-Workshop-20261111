name: RocketRide diagram agent Cloud deploy

# Push verifies syntax only. Cloud publication requires explicit manual dispatch.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-rocketride-diagram-agent.yml
      - scripts/deploy-rocketride-diagram-agent.mjs
  workflow_dispatch:
    inputs:
      team_id:
        description: RocketRide Cloud team ID matching authenticated devTeam
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: rocketride-diagram-cloud-deploy
  cancel-in-progress: false

jobs:
  syntax:
    name: Check deploy script syntax without credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/deploy-rocketride-diagram-agent.mjs

  deploy:
    name: Publish Cloud pipeline and smoke-test deployed run
    if: github.event_name == 'workflow_dispatch'
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROCKETRIDE_APIKEY: ${{ secrets.ROCKETRIDE_APIKEY }}
      ROCKETRIDE_TEAM_ID: ${{ inputs.team_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure secure configuration exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROCKETRIDE_APIKEY" || { echo "Missing Actions secret ROCKETRIDE_APIKEY"; exit 1; }
          test -n "$ROCKETRIDE_TEAM_ID" || { echo "Missing target Cloud team ID"; exit 1; }
      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive --ignore-scripts
      - name: Deploy, start and verify Cloud Mermaid response
        run: node scripts/deploy-rocketride-diagram-agent.mjs
      - name: Push sanitized Cloud deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/DIAGRAM_AGENT_CLOUD_DEPLOYMENT.md
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)" || {
            echo "main advanced; refusing to overwrite newer commits"
            exit 1
          }
          git add docs/DIAGRAM_AGENT_CLOUD_DEPLOYMENT.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "cicd/rocketride: record live Cloud deployment and smoke evidence"
          git push origin HEAD:refs/heads/main
